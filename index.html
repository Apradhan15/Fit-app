  <meta name="application-name" content="FIT" /><title>FIT — Just do today</title>
  <style>
  :root { color-scheme: light; --ink:#17221e;--muted:#67726b;--line:#e1e7df;--bg:#f7f9f5;--card:#fff;--green:#224c39;--mint:#e6f1e7;--lime:#d5ef82; }
  *{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}button{cursor:pointer} .app{max-width:500px;min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 20px calc(95px + env(safe-area-inset-bottom));background:var(--bg)}
  header{display:flex;align-items:center;justify-content:space-between;padding:27px 0 23px}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900;letter-spacing:-1.2px}.mark{width:39px;height:39px;display:grid;place-items:center;border-radius:13px;background:var(--ink);color:var(--lime);font-size:23px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800;color:var(--muted)}.date{font-size:12px;color:var(--muted);font-weight:700;text-align:right}
  .hero{background:var(--ink);color:white;border-radius:25px;padding:25px 22px;margin-bottom:17px}.hero .eyebrow{color:#a5c6b1}.hero h1{font-size:29px;line-height:1.09;letter-spacing:-1px;margin:9px 0 11px}.hero p{margin:0;color:#d5e0d7;font-size:14px;line-height:1.5}.hero .hero-foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px}.pill{display:inline-flex;border-radius:50px;background:var(--lime);color:#233418;padding:8px 12px;font-size:12px;font-weight:800}.pill.dark{background:#314b3e;color:#d6eccc}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0}.section-title{font-size:19px;letter-spacing:-.45px;font-weight:800;margin:0 0 12px}.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.sub{font-size:13px;color:var(--muted);margin:0 0 12px}.task{display:flex;align-items:center;gap:12px;min-height:55px;padding:9px 0;border-top:1px solid #eef1ed}.task:first-of-type{border-top:0}.tick{appearance:none;display:grid;place-items:center;flex:0 0 auto;width:27px;height:27px;border:2px solid #b4c5b8;border-radius:9px;background:#fff;color:white}.tick:checked{background:var(--green);border-color:var(--green)}.tick:checked:after{content:'✓';font-weight:900;font-size:17px}.tasklabel{flex:1;font-weight:650}.tasklabel.done{color:#8a978d;text-decoration:line-through}.small{font-size:12px;color:var(--muted)}.primary{display:block;width:100%;padding:15px 18px;border-radius:15px;background:var(--green);color:white;border:0;font-size:15px;font-weight:800;text-align:center}.secondary{display:block;width:100%;padding:13px 16px;border-radius:14px;background:#edf3eb;border:1px solid #d7e3d7;color:var(--green);font-weight:800}.plain{border:0;background:transparent;color:var(--green);font-weight:800;padding:7px 0}.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{background:white;border-radius:17px;border:1px solid var(--line);padding:14px 9px;text-align:center}.metric b{display:block;font-size:20px;letter-spacing:-.6px}.metric small{display:block;font-size:10px;color:var(--muted);font-weight:700;margin-top:3px}.progress{height:8px;border-radius:99px;overflow:hidden;background:#e9eee8;margin:12px 0}.progress>div{height:100%;background:var(--green);transition:width .18s}.daybuttons{display:flex;gap:6px;overflow:auto;padding:3px 0 8px;scrollbar-width:none}.daybtn{flex:1;min-width:42px;border:1px solid var(--line);background:white;border-radius:12px;padding:8px 4px;color:var(--muted);font-size:11px;font-weight:800}.daybtn.active{background:var(--green);color:white;border-color:var(--green)}.exercise{padding:16px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border:0}.exercise-head{display:flex;align-items:start;justify-content:space-between;gap:9px;margin-bottom:9px}.exercise-title{font-size:16px;font-weight:800}.exercise-prescription{font-size:12px;color:var(--muted);margin-top:4px}.set-row{display:flex;align-items:center;gap:8px;margin:7px 0}.set-label{width:42px;flex-shrink:0;color:var(--muted);font-size:12px;font-weight:800}.set-row input[type='number']{width:77px;min-width:0;padding:10px 7px;border:1px solid var(--line);border-radius:10px;background:#f9faf8;text-align:center;color:var(--ink);font-size:14px}.set-row input[type='number']:focus,.value-input:focus{outline:2px solid #83aa89}.unit{font-size:11px;color:var(--muted)}.set-row .tick{width:29px;height:29px;margin-left:auto}.hint{font-size:11px;color:var(--muted);margin:6px 0}.meal{border-top:1px solid var(--line);padding:14px 0}.meal:first-of-type{border-top:0}.meal b{font-size:13px}.meal p{margin:4px 0 0;color:var(--muted);font-size:13px}.quick{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #cbdacf;border-radius:50px;padding:10px 14px;background:#f2f6ef;color:var(--green);font-weight:800;font-size:13px}.target-num{font-size:34px;letter-spacing:-1.3px;font-weight:900}.flex{display:flex;justify-content:space-between;align-items:center;gap:10px}.value-input{width:100%;border:1px solid var(--line);padding:12px 14px;border-radius:11px;background:white;max-width:130px}.field{display:flex;align-items:center;justify-content:space-between;margin:12px 0;gap:15px}.field label{font-weight:700;font-size:13px}.log{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;font-size:13px}.notice{padding:12px;border-radius:12px;background:var(--mint);color:var(--green);font-size:12px;margin-top:12px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,500px);display:flex;justify-content:space-around;background:rgba(255,255,255,.97);border-top:1px solid #e4e8e1;padding:11px 6px calc(12px + env(safe-area-inset-bottom));z-index:3}.nav button{display:flex;align-items:center;flex-direction:column;gap:3px;border:0;background:transparent;color:#7b8a7f;font-size:11px;font-weight:750;min-width:63px}.nav button.active{color:var(--green)}.nav .nicon{font-size:22px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#17221e;color:#fff;padding:10px 17px;border-radius:12px;z-index:10;font-weight:700;white-space:nowrap;box-shadow:0 5px 16px #0002}.hidden{display:none!important}h2{font-size:23px;letter-spacing:-.6px;margin:0 0 7px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.5}@media(max-width:360px){.app{padding-left:13px;padding-right:13px}.set-row{gap:5px}.set-row input[type='number']{width:65px}}

  /* FIT 2 — execution-first */
  :root{--ink:#0d1b18;--green:#0c5d43;--lime:#c8f58b;--bg:#f6f8f5;--muted:#66766c}
  .mark{background:#0d1b18;color:#b7f7b7;border-radius:11px;overflow:hidden;padding:0}.mark img{width:39px;height:39px;display:block}
  .hero{background:linear-gradient(135deg,#102a23,#091b17);border-radius:24px;padding:26px 22px}
  .hero h1{font-size:30px}.primary{background:#0b6a48;min-height:54px;border-radius:16px}.hero-primary{background:var(--lime);color:#143224;border:0;width:100%;min-height:53px;border-radius:15px;font-size:16px;font-weight:850;margin-top:18px}
  .clean-day{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:white;border:1px solid var(--line);border-radius:15px;margin:8px 0;font-weight:720}
  .clean-day .checkbig{appearance:none;flex:0 0 auto;width:31px;height:31px;border:2px solid #c9d8cf;border-radius:50%;background:white;display:grid;place-items:center;cursor:pointer}
  .clean-day .checkbig:checked{background:#126f4d;border-color:#126f4d}.clean-day .checkbig:checked:after{content:'✓';font-size:19px;color:white;font-weight:850}
  .clean-day.completed .exercise-mini-title{text-decoration:line-through;color:#7c8b82}
  .exercise-mini-title{font-size:15px;font-weight:790}.exercise-mini-desc{font-size:12px;color:var(--muted);margin-top:3px}
  .expand-detail{font-size:12px;color:var(--green);font-weight:770;border:0;background:transparent;padding:7px 0;cursor:pointer}
  .exercise-block{background:white;border:1px solid var(--line);border-radius:18px;padding:8px 14px;margin:9px 0}
  .exercise-block .clean-day{border:0;margin:0;padding:9px 0}
  .exercise-block details{border-top:1px solid #edf2ed;padding:4px 0 12px}.exercise-block details summary{cursor:pointer;list-style:none;font-size:12px;color:var(--green);font-weight:800;padding:9px 0}.exercise-block details summary::-webkit-details-marker{display:none}
  .exercise-block .set-row{padding:5px 0}.exercise-block .set-row input[type='number']{width:76px}
  .today-meter{background:#f3f7f0;border-radius:14px;padding:13px 14px;margin-top:15px}
  .today-meter .numbers{display:flex;justify-content:space-between;font-size:12px;font-weight:780}
  .tiny-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.tiny-actions button{background:#e9f3e8;color:#174936;font-size:13px;border:1px solid #d6e6d6;border-radius:13px;padding:10px 14px;font-weight:780}
  .next-instruction{background:#e8f4ed;color:#153c2e;border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.5;margin:12px 0}
  .subtlebtn{border:0;background:transparent;color:var(--green);font-size:13px;font-weight:750;text-decoration:underline;text-underline-offset:3px}
  .nav{box-shadow:0 -8px 20px #17221e08}.nav button.active .nicon{color:#0b7d53}
  .helptext{font-size:12px;color:var(--muted);line-height:1.5}
  
  /* FIT v3 — original blue → purple visual language, streamlined coach workflow */
  :root {--ink:#182244;--muted:#727b94;--line:#e6e8f5;--bg:#f7f8ff;--card:#fff;--green:#5f46df;--mint:#eeebff;--lime:#e0dcff}
  body,.app{background:var(--bg);color:var(--ink)}
  .brand{color:#22244d}.mark{background:linear-gradient(135deg,#1976f3,#8c3ddc);box-shadow:0 4px 12px #6547dc25}
  .hero{background:linear-gradient(128deg,#1769dc 0%,#544cde 51%,#8b3bd0 100%);box-shadow:0 12px 30px #574ed92a}
  .hero .eyebrow{color:#e1e8ff}.hero p{color:#edf0ff}.hero .pill{background:#ffffff25;color:#fff}.hero .pill.dark{background:#ffffff28;color:#fff}
  .hero-primary{background:#fff;color:#4d44d8;box-shadow:0 5px 15px #1718571e}
  .primary{background:linear-gradient(105deg,#2675ee,#7145db);box-shadow:0 3px 10px #6053d923}
  .secondary{background:#f0edff;border-color:#ded8fb;color:#563bcb}
  .plain,.subtlebtn,.expand-detail,.exercise-block details summary{color:#6044d3}
  .nav{border-top-color:#e7e6f7;box-shadow:0 -8px 24px #3333a90a}
  .nav button.active,.nav button.active .nicon{color:#6351da}
  .tick{border-color:#c9c7e8}.tick:checked,.clean-day .checkbig:checked{background:linear-gradient(135deg,#2677e9,#8a43d7);border-color:#6352db}
  .clean-day .checkbig{border-color:#cfcae9}.clean-day.completed .exercise-mini-title{color:#8990a7}
  .card,.metric,.clean-day,.exercise-block,.daybtn{border-color:#e7e7f5}
  .daybtn.active{background:linear-gradient(120deg,#2377eb,#8043d4);border-color:#614fd7}
  .progress{background:#eeeafa}.progress>div{background:linear-gradient(90deg,#297af2,#8545d7)}
  .next-instruction{background:#eceaff;color:#302b75}.today-meter{background:#f0edff}
  .tiny-actions button,.chip{background:#f0edff;color:#5238be;border-color:#ddd6fb}
  .notice{background:#eeebff;color:#3d3198}.set-row input[type='number']:focus,.value-input:focus{outline:2px solid #9782e7}
  .toast{background:#27265b}.exercise-block details{border-color:#eceaf6}.task{border-color:#eeecf8}
  </style>
</head>
<body><div class="app"><header><div class="brand"><div class="mark"><img src="icon-192.png" alt=""></div> FIT</div><div class="date" id="header-date"></div></header><main id="root"></main></div><nav class="nav" id="nav"></nav><div id="toast" class="toast hidden" role="status"></div><script src="app.js?v=3" defer></script></body></html>
